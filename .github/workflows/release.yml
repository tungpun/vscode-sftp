name: Release

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ssh2's native crypto/cpu-features addons are optional and fall back to pure JS.
      # Skipping them keeps the .vsix free of OS-specific binaries, so one build runs everywhere.
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # vsce runs the vscode:prepublish script (webpack compile) before packaging.
      - name: Package extension
        id: package
        run: |
          file="sftp-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}.vsix"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            file="sftp-${GITHUB_REF_NAME#v}.vsix"
          fi
          npx --yes @vscode/vsce@3 package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.file }}
          path: ${{ steps.package.outputs.file }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --title "$GITHUB_REF_NAME" --generate-notes

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ssh2's native crypto/cpu-features addons are optional and fall back to pure JS.
      # Skipping them keeps the .vsix free of OS-specific binaries, so one build runs everywhere.
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional

      # Release when pushing a v* tag, or when main has a package.json version that is not tagged yet.
      # So merging a version bump into main publishes it; other pushes and PRs only build.
      - name: Resolve version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
              exit 1
            fi
            release=true
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::notice::$tag is already released. Bump the version in package.json to release again."
            else
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            echo "file=sftp-$version.vsix" >> "$GITHUB_OUTPUT"
          else
            echo "file=sftp-$version-${GITHUB_SHA::7}.vsix" >> "$GITHUB_OUTPUT"
          fi

      # vsce runs the vscode:prepublish script (webpack compile) before packaging.
      - name: Package extension
        run: npx --yes @vscode/vsce@3 package --out "${{ steps.version.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: ${{ steps.version.outputs.file }}

      # Creates the tag on this commit if it doesn't exist. Tags created with GITHUB_TOKEN
      # don't trigger workflows, so this doesn't start a second release run.
      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FILE: ${{ steps.version.outputs.file }}
        run: gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
